<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBKR Risk Monitor</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e3a8a;
            border-radius: 10px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #2563eb;
        }

        .terminal-glow {
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.4);
        }
        .terminal-scanline {
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            pointer-events: none;
        }
        .terminal-container {
            background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
            position: relative;
            overflow: hidden;
        }
        .terminal-container::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 0%, rgba(2, 6, 23, 0.3) 100%);
            pointer-events: none;
        }
        @keyframes loading {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        @keyframes result-flash {
            0% { color: #f8fafc; text-shadow: none; }
            50% { color: #22d3ee; text-shadow: 0 0 15px rgba(34, 211, 238, 0.8); transform: scale(1.05); }
            100% { color: #f8fafc; text-shadow: none; }
        }
        .animate-result-flash {
            animation: result-flash 0.4s ease-out;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Local icon mapping (zero-dependency)
        const Shield = (p) => <RawShieldIcon {...p} />;
        const Activity = (p) => <RawActivityIcon {...p} />;
        const TrendingUp = (p) => <RawTrendingUpIcon {...p} />;
        const ShieldCheck = (p) => <RawShieldCheckIcon {...p} />;
        const Settings = (p) => <RawSettingsIcon {...p} />;
        const RefreshCcw = (p) => <RawRefreshCcwIcon {...p} />;
        const Power = (p) => <RawPowerIcon {...p} />;
        const Info = (p) => <RawInfoIcon {...p} />;
        const ArrowUpRight = (p) => <RawArrowUpRightIcon {...p} />;
        const ArrowDownRight = (p) => <RawArrowDownRightIcon {...p} />;
        const Wallet = (p) => <RawWalletIcon {...p} />;
        const Zap = (p) => <RawZapIcon {...p} />;
        const Cpu = (p) => <RawCpuIcon {...p} />;
        const ChevronDown = (p) => <RawChevronDownIcon {...p} />;
        const AlertOctagon = (p) => <RawAlertOctagonIcon {...p} />;
        const Network = (p) => <RawNetworkIcon {...p} />;
        const Database = (p) => <RawDatabaseIcon {...p} />;
        const Eye = (p) => <RawEyeIcon {...p} />;
        const EyeOff = (p) => <RawEyeOffIcon {...p} />;
        const AlertOctagonIcon = (p) => <RawAlertOctagonIcon {...p} />;
        const PieChart = (p) => <RawPieChartIcon {...p} />;
        const Landmark = (p) => <RawLandmarkIcon {...p} />;
        const Briefcase = (p) => <RawBriefcaseIcon {...p} />;
        const Banknote = (p) => <RawBanknoteIcon {...p} />;
        const AlertCircle = (p) => <RawAlertIcon {...p} />;
        const ChevronLeft = (p) => <RawChevronLeftIcon {...p} />;
        const ChevronRight = (p) => <RawChevronRightIcon {...p} />;
        const Calculator = (p) => <RawCalculatorIcon {...p} />;
        const ChevronUp = (p) => <RawChevronUpIcon {...p} />;

        // Custom Inline Icons for reliable rendering
        const SvgWrapper = ({ children, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className || "w-4 h-4"}>{children}</svg>
        );
        const RawDatabaseIcon = (p) => <SvgWrapper {...p}><ellipse cx="12" cy="5" rx="9" ry="3" /><path d="M3 5V19A9 3 0 0 0 21 19V5" /><path d="M3 12A9 3 0 0 0 21 12" /></SvgWrapper>;
        const RawWalletIcon = (p) => <SvgWrapper {...p}><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4" /><path d="M3 5v14a2 2 0 0 0 2 2h16v-5" /><path d="M18 12a2 2 0 0 0 0 4h4v-4Z" /></SvgWrapper>;
        const RawActivityIcon = (p) => <SvgWrapper {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12" /></SvgWrapper>;
        const RawTrendingUpIcon = (p) => <SvgWrapper {...p}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /><polyline points="16 7 22 7 22 13" /></SvgWrapper>;
        const RawShieldIcon = (p) => <SvgWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /></SvgWrapper>;
        const RawXIcon = (p) => <SvgWrapper {...p}><line x1="18" y1="6" x2="6" y2="18" /><line x1="6" y1="6" x2="18" y2="18" /></SvgWrapper>;
        const RawAlertIcon = (p) => <SvgWrapper {...p}><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></SvgWrapper>;
        const RawShieldCheckIcon = (p) => <SvgWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" /><path d="m9 12 2 2 4-4" /></SvgWrapper>;
        const RawZapIcon = (p) => <SvgWrapper {...p}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></SvgWrapper>;
        const RawPieChartIcon = (p) => <SvgWrapper {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83" /><path d="M22 12A10 10 0 0 0 12 2v10z" /></SvgWrapper>;
        const RawLandmarkIcon = (p) => <SvgWrapper {...p}><path d="M3 22h18" /><path d="M6 18v-7" /><path d="M10 18v-7" /><path d="M14 18v-7" /><path d="M18 18v-7" /><path d="M12 2l8 5H4z" /></SvgWrapper>;
        const RawBriefcaseIcon = (p) => <SvgWrapper {...p}><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></SvgWrapper>;
        const RawBanknoteIcon = (p) => <SvgWrapper {...p}><rect width="20" height="12" x="2" y="6" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" /></SvgWrapper>;
        const RawEyeIcon = (p) => <SvgWrapper {...p}><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></SvgWrapper>;
        const RawEyeOffIcon = (p) => <SvgWrapper {...p}><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" /><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" /><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" /><line x1="2" y1="2" x2="22" y2="22" /></SvgWrapper>;
        const RawChevronLeftIcon = (p) => <SvgWrapper {...p}><polyline points="15 18 9 12 15 6" /></SvgWrapper>;
        const RawChevronRightIcon = (p) => <SvgWrapper {...p}><polyline points="9 18 15 12 9 6" /></SvgWrapper>;
        const RawChevronDownIcon = (p) => <SvgWrapper {...p}><polyline points="6 9 12 15 18 9" /></SvgWrapper>;
        const RawChevronUpIcon = (p) => <SvgWrapper {...p}><polyline points="18 15 12 9 6 15" /></SvgWrapper>;
        const RawPowerIcon = (p) => <SvgWrapper {...p}><path d="M18.36 6.64a9 9 0 1 1-12.73 0" /><line x1="12" y1="2" x2="12" y2="12" /></SvgWrapper>;
        const RawRefreshCcwIcon = (p) => <SvgWrapper {...p}><polyline points="1 4 1 10 7 10" /><polyline points="23 20 23 14 17 14" /><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4-4.64 4.36A9 9 0 0 1 3.51 15" /></SvgWrapper>;
        const RawSettingsIcon = (p) => <SvgWrapper {...p}><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" /></SvgWrapper>;
        const RawInfoIcon = (p) => <SvgWrapper {...p}><circle cx="12" cy="12" r="10" /><line x1="12" y1="16" x2="12" y2="12" /><line x1="12" y1="8" x2="12.01" y2="8" /></SvgWrapper>;
        const RawArrowUpRightIcon = (p) => <SvgWrapper {...p}><path d="M7 17 17 7" /><path d="M7 7h10v10" /></SvgWrapper>;
        const RawArrowDownRightIcon = (p) => <SvgWrapper {...p}><path d="M7 7 17 17" /><path d="M17 7v10H7" /></SvgWrapper>;
        const RawNetworkIcon = (p) => <SvgWrapper {...p}><rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v3" /><path d="M12 12V8" /></SvgWrapper>;
        const RawExternalLinkIcon = (p) => <SvgWrapper {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" /><polyline points="15 3 21 3 21 9" /><line x1="10" y1="14" x2="21" y2="3" /></SvgWrapper>;
        const RawAlertOctagonIcon = (p) => <SvgWrapper {...p}><polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></SvgWrapper>;
        const RawCpuIcon = (p) => <SvgWrapper {...p}><rect x="4" y="4" width="16" height="16" rx="2" /><rect x="9" y="9" width="6" height="6" /><path d="M15 2v2M9 2v2M2 15h2M2 9h2M22 15h-2M22 9h-2M15 22v-2M9 22v-2" /></SvgWrapper>;
        const RawCalculatorIcon = (p) => <SvgWrapper {...p}><rect width="16" height="20" x="4" y="2" rx="2" /><line x1="8" y1="6" x2="16" y2="6" /><line x1="16" y1="14" x2="16" y2="18" /><path d="M16 10h.01" /><path d="M12 10h.01" /><path d="M8 10h.01" /><path d="M12 14h.01" /><path d="M8 14h.01" /><path d="M12 18h.01" /><path d="M8 18h.01" /></SvgWrapper>;



        const API_BASE = "/api";

        const PositionSizerFAB = ({ onClick }) => (
            <button 
                title="Position Size Calculator"
                onClick={onClick}
                className="fixed bottom-6 right-6 z-[90] w-14 h-14 bg-emerald-600 hover:bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-600/30 transition-all hover:scale-110 active:scale-90 group"
            >
                <Calculator className="w-6 h-6 text-emerald-50 group-hover:rotate-12 transition-transform" />
            </button>
        );

        const PositionSizerContent = ({ principalState, onClose, isStandalone }) => {
            const [ticker, setTicker] = useState("");
            const [side, setSide] = useState("LONG"); // LONG or SHORT
            const [risk, setRisk] = useState(0.3);
            const [atr, setAtr] = useState("");
            const [price, setPrice] = useState("");
            const [stopPrice, setStopPrice] = useState("");
            const [loading, setLoading] = useState(false);

            const handleTickerEnter = async (e) => {
                if (e.key === 'Enter' && ticker) {
                    setLoading(true);
                    try {
                        const res = await fetch(`${API_BASE}/ticker-details`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ symbol: ticker })
                        });
                        if (res.ok) {
                            const data = await res.json();
                            if (data.status === "success" && data.price > 0) {
                                setPrice(data.price.toFixed(2));
                                setAtr(data.atr.toFixed(2));
                                const recStop = side === "LONG" 
                                    ? (data.price - 0.3 * data.atr) 
                                    : (data.price + 0.3 * data.atr);
                                setStopPrice(recStop.toFixed(2));
                            } else {
                                alert(data.message || "Could not fetch ticker details");
                            }
                        } else {
                            const err = await res.json();
                            alert(err.detail || "Server error during ticker lookup");
                        }
                    } catch (err) {
                        console.error("Fetch error:", err);
                        alert("Failed to reach server for ticker lookup. Ensure the backend is running and reachable.");
                    }
                    setLoading(false);
                }
            };

            const handleDetach = () => {
                const width = 450;
                const height = 800;
                const left = (window.screen.width / 2) - (width / 2);
                const top = (window.screen.height / 2) - (height / 2);
                window.open(
                    `${window.location.origin}${window.location.pathname}?mode=standalone&principalState=${principalState}`,
                    'PositionSizer',
                    `width=${width},height=${height},left=${left},top=${top},resizable=yes,scrollbars=yes`
                );
            };

            const isInvalidStop = price && stopPrice && (
                side === 'LONG' ? Number(stopPrice) >= Number(price) : Number(stopPrice) <= Number(price)
            );

            const riskAmount = (principalState * risk) / 100;
            const riskPerShare = side === 'LONG' 
                ? (Number(price) - Number(stopPrice)) 
                : (Number(stopPrice) - Number(price));
                
            const shares = (!isInvalidStop && riskPerShare > 0) ? Math.floor(riskAmount / riskPerShare) : 0;
            const positionValue = shares * Number(price);

            return (
                <div className={`bg-[#020617] border border-cyan-500/20 w-full max-w-md ${isStandalone ? 'h-screen' : 'rounded-[2rem] shadow-[0_0_80px_rgba(6,182,212,0.15)]'} overflow-hidden relative mx-auto`}>
                    <div className="absolute top-0 right-0 w-40 h-40 bg-cyan-500/5 blur-[60px] pointer-events-none" />
                    
                    {/* Header */}
                    <div className="bg-cyan-500/5 p-7 border-b border-cyan-500/10 flex justify-between items-center relative z-10">
                        <div className="flex items-center gap-4">
                            <div className="p-2.5 bg-cyan-500/10 rounded-xl shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                                <RawCalculatorIcon className="w-6 h-6 text-cyan-400" />
                            </div>
                            <div className="flex flex-col">
                                <h2 className="text-xl font-bold text-blue-50 uppercase tracking-[0.2em]">Position Sizer</h2>
                                <span className="text-[10px] font-black text-cyan-500/40 uppercase tracking-[0.3em]">Risk assessment</span>
                            </div>
                        </div>
                        <div className="flex items-center gap-2">
                            {!isStandalone && (
                                <button onClick={handleDetach} title="Detach Window" className="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:text-cyan-400 hover:bg-white/5 transition-all">
                                    <RawExternalLinkIcon className="w-5 h-5" />
                                </button>
                            )}
                            <button onClick={onClose} className="w-10 h-10 rounded-full flex items-center justify-center text-slate-500 hover:text-white hover:bg-white/5 transition-all active:scale-90">
                                <RawXIcon className="w-6 h-6" />
                            </button>
                        </div>
                    </div>

                    {/* Body */}
                    <div className="p-8 space-y-8 relative z-10 custom-scrollbar overflow-y-auto" style={{ maxHeight: isStandalone ? 'calc(100vh - 100px)' : 'auto' }}>
                        {/* Principal State */}
                        <div className="flex justify-between items-center bg-blue-950/20 border border-blue-900/20 p-5 rounded-2xl">
                            <span className="text-[11px] text-cyan-400/80 uppercase font-black tracking-[0.2em]">Principal State</span>
                            <span className="text-2xl font-light text-cyan-100 tracking-tighter">${Number(principalState || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</span>
                        </div>

                        <div className="space-y-6">
                            {/* Ticker */}
                            <div>
                                <label className="text-[10px] text-blue-200/70 uppercase font-black tracking-[0.2em] mb-3 block">Ticker Symbol</label>
                                <div className="relative">
                                    <input 
                                        type="text" 
                                        value={ticker}
                                        onChange={(e) => setTicker(e.target.value.toUpperCase())}
                                        onKeyDown={handleTickerEnter}
                                        placeholder="ENTER SYMBOL..."
                                        className="w-full bg-blue-950/10 rounded-2xl p-4 border border-blue-900/30 text-blue-50 font-bold focus:ring-1 focus:ring-cyan-500/40 outline-none transition-all placeholder:text-blue-200/20 text-lg uppercase"
                                    />
                                    <div className="absolute right-2 top-1/2 -translate-y-1/2 flex gap-1 bg-blue-950/40 rounded-xl p-1 border border-blue-900/20">
                                        <button 
                                            onClick={() => setSide('LONG')}
                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all duration-300 active:scale-95 ${side === 'LONG' ? 'bg-cyan-500/20 text-cyan-400 shadow-[0_0_12px_rgba(34,211,238,0.2)] border border-cyan-500/30' : 'text-slate-500 hover:text-slate-300'}`}
                                        >
                                            LONG
                                        </button>
                                        <button 
                                            onClick={() => setSide('SHORT')}
                                            className={`px-3 py-1.5 rounded-lg text-[10px] font-black transition-all duration-300 active:scale-95 ${side === 'SHORT' ? 'bg-rose-500/20 text-rose-400 shadow-[0_0_12px_rgba(244,63,94,0.2)] border border-rose-500/30' : 'text-slate-500 hover:text-slate-300'}`}
                                        >
                                            SHORT
                                        </button>
                                    </div>
                                </div>
                                <div className="flex justify-between mt-2">
                                    <p className="text-[9px] text-blue-400/60 uppercase tracking-widest">Hit Enter to sync</p>
                                    <div className="flex gap-2">
                                        <button onClick={() => setTicker('SPY')} className="text-[9px] text-blue-400/40 hover:text-blue-400 transition-colors uppercase">SPY</button>
                                        <button onClick={() => setTicker('QQQ')} className="text-[9px] text-blue-400/40 hover:text-blue-400 transition-colors uppercase">QQQ</button>
                                    </div>
                                </div>
                            </div>

                            {/* Risk Options */}
                            <div>
                                <div className="flex justify-between mb-3">
                                    <label className="text-[10px] text-blue-200/70 uppercase font-black tracking-[0.2em]">Risk Constraint</label>
                                    <span className="text-[10px] text-orange-400 font-bold">${riskAmount.toLocaleString(undefined, { maximumFractionDigits: 0 })} AT RISK</span>
                                </div>
                                <div className="grid grid-cols-4 gap-2">
                                    {[0.2, 0.3, 0.4, 0.5].map((val) => (
                                        <button 
                                            key={val}
                                            onClick={() => setRisk(val)}
                                            className={`py-3 rounded-xl border text-[11px] font-black transition-all active:scale-95 ${risk === val ? 'bg-cyan-500/20 border-cyan-500 text-cyan-300 shadow-[0_0_15px_rgba(6,182,212,0.2)]' : 'bg-blue-950/5 border-blue-900/10 text-blue-400/60 hover:border-blue-700/40 hover:text-blue-300'}`}
                                        >
                                            {val}%
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* ATR Section (Secondary) */}
                            <div className="flex justify-between items-center bg-blue-950/5 p-3 rounded-xl border border-blue-900/10">
                                <label className="text-[9px] text-blue-300/40 uppercase font-black tracking-[0.2em]">ATR (14) Reference</label>
                                <input type="number" step="0.01" value={atr} onChange={(e) => setAtr(e.target.value)} className="bg-transparent text-emerald-400 font-mono text-sm outline-none text-right w-24" />
                            </div>

                            {/* Main Inputs Grid */}
                            <div className="space-y-4">
                                {/* Mark Price Card */}
                                <div className="bg-blue-500/5 p-5 rounded-2xl border border-blue-500/20 hover:border-blue-500/40 transition-all">
                                    <div className="flex justify-between mb-2">
                                        <label className="text-[10px] text-blue-400 uppercase font-black tracking-[0.2em]">Entry Price</label>
                                        <span className="text-[9px] text-blue-500/50 uppercase font-bold italic">Manual Entry / Sync</span>
                                    </div>
                                    <input type="number" step="0.01" value={price} onChange={(e) => setPrice(e.target.value)} className="w-full bg-transparent text-blue-100 font-mono text-3xl outline-none tracking-tighter font-bold" />
                                </div>

                                {/* Stop Price Card */}
                                <div className={`p-5 rounded-2xl border transition-all ${isInvalidStop ? 'bg-red-500/10 border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.2)]' : 'bg-orange-500/5 border-orange-500/20 hover:border-orange-500/40'}`}>
                                    <div className="flex justify-between mb-2">
                                        <label className={`text-[10px] uppercase font-black tracking-[0.2em] ${isInvalidStop ? 'text-red-400' : 'text-orange-400'}`}>Stop Price</label>
                                        <span className="text-[11px] text-orange-500/90 uppercase font-black tracking-wider">
                                            Price {side === 'LONG' ? '-' : '+'} (0.3 × ATR) {atr && price ? (
                                                <button 
                                                    onClick={() => {
                                                        const val = side === 'LONG' 
                                                            ? (Number(price) - 0.3 * Number(atr))
                                                            : (Number(price) + 0.3 * Number(atr));
                                                        setStopPrice(val.toFixed(2));
                                                    }}
                                                    className="ml-1 text-cyan-400 hover:text-cyan-300 transition-colors border-b border-cyan-400/30 text-xs font-bold"
                                                    title="Click to reset to recommended value"
                                                >
                                                    [${(side === 'LONG' ? (Number(price) - 0.3 * Number(atr)) : (Number(price) + 0.3 * Number(atr))).toFixed(2)}]
                                                </button>
                                            ) : ''}
                                        </span>
                                    </div>
                                    <input type="number" step="0.01" value={stopPrice} onChange={(e) => setStopPrice(e.target.value)} className={`w-full bg-transparent font-mono text-3xl outline-none tracking-tighter font-bold ${isInvalidStop ? 'text-red-400' : 'text-orange-300'}`} />
                                </div>
                            </div>
                        </div>

                        {isInvalidStop && (
                            <div className="mx-8 p-4 bg-red-950/30 border border-red-500/40 rounded-2xl flex items-center gap-3 animate-pulse">
                                <RawAlertOctagonIcon className="w-5 h-5 text-red-500" />
                                <span className="text-[10px] font-black text-red-400 uppercase tracking-widest leading-tight">
                                    Invalid Stop Level: Stop must be {side === 'LONG' ? 'below' : 'above'} entry price for {side} positions.
                                </span>
                            </div>
                        )}

                        {/* RESULTS SECTION */}
                        <div className="pt-6 border-t border-blue-900/20 flex flex-col items-center">
                            <div className="grid grid-cols-2 w-full gap-8">
                                <div className="flex flex-col items-center">
                                    <span className="text-[10px] text-blue-300/60 uppercase font-black tracking-[0.3em] mb-3">Position Size</span>
                                    <div key={shares} className="text-4xl font-bold text-blue-50 tracking-tighter animate-result-flash">
                                        {shares} <span className="text-sm font-bold text-blue-400/60 uppercase tracking-widest ml-1">Shares</span>
                                    </div>
                                </div>
                                <div className="flex flex-col items-center">
                                    <span className="text-[10px] text-blue-300/60 uppercase font-black tracking-[0.3em] mb-3">Total Value</span>
                                    <div key={positionValue} className="text-4xl font-bold text-blue-50 tracking-tighter animate-result-flash">
                                        <span className="text-blue-500/60 mr-1">$</span>{Math.round(positionValue).toLocaleString()}
                                    </div>
                                </div>
                            </div>
                            
                            {/* Stop Distance as ATR fraction */}
                            {atr && price && stopPrice && (
                                <div className="mt-6 text-center">
                                    <span className="text-[10px] text-blue-400/50 uppercase font-black tracking-[0.2em]">
                                        Stop Distance: <span className="text-cyan-400/80">{(Math.abs(Number(price) - Number(stopPrice)) / Number(atr)).toFixed(2)} * ATR(14)</span>
                                    </span>
                                </div>
                            )}
                        </div>
                    </div>
                    
                    {loading && (
                        <div className="absolute inset-0 bg-black/60 backdrop-blur-[2px] z-50 flex flex-col items-center justify-center">
                            <div className="h-1 w-48 bg-blue-950 rounded-full overflow-hidden mb-4 shadow-[0_0_15px_rgba(6,182,212,0.2)]">
                                <div className="h-full bg-cyan-500 animate-[loading_1.5s_infinite]" />
                            </div>
                            <span className="text-[10px] text-cyan-500 font-black uppercase tracking-[0.4em] terminal-glow">Scanning TWS...</span>
                        </div>
                    )}
                </div>
            );
        };

        const PositionSizerModal = ({ isOpen, onClose, principalState }) => {
            if (!isOpen) return null;
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md transition-all duration-500">
                    <PositionSizerContent principalState={principalState} onClose={onClose} isStandalone={false} />
                </div>
            );
        };

        const SafeIcon = ({ icon: IconComponent, ...props }) => {
            if (!IconComponent) return <div className="w-4 h-4 bg-blue-500/10 rounded" />;
            return <IconComponent {...props} />;
        };

        const StatCard = ({ title, value, subValue, icon: Icon, tooltip, color = 'blue', badge }) => {
            const colors = {
                blue: { bg: 'bg-blue-500/15', text: 'text-blue-400', glow: 'shadow-blue-500/20' },
                cyan: { bg: 'bg-cyan-500/15', text: 'text-cyan-400', glow: 'shadow-cyan-500/20' },
                indigo: { bg: 'bg-indigo-500/15', text: 'text-indigo-400', glow: 'shadow-indigo-500/20' },
                amber: { bg: 'bg-amber-500/15', text: 'text-amber-400', glow: 'shadow-amber-500/20' },
                emerald: { bg: 'bg-emerald-500/15', text: 'text-emerald-400', glow: 'shadow-emerald-500/20' },
                violet: { bg: 'bg-violet-500/15', text: 'text-violet-400', glow: 'shadow-violet-500/20' },
            };
            const c = colors[color] || colors.blue;
            return (
                <div className="bg-[#0f172a] border border-blue-900/30 p-5 rounded-2xl hover:border-blue-700/40 transition-all shadow-lg group relative h-full flex flex-col justify-between">
                    <div>
                        <div className="flex justify-between items-start mb-3">
                            <div className="flex items-center gap-1.5">
                                <span className="text-blue-300/60 text-[10px] font-black uppercase tracking-[0.15em]">{title}</span>
                                {tooltip && <RawInfoIcon className="w-3 h-3 text-blue-900 group-hover:text-blue-500 cursor-help transition-colors" />}
                            </div>
                            {Icon && (
                                <div className={`w-8 h-8 rounded-xl flex items-center justify-center ${c.bg} shadow-lg ${c.glow} group-hover:scale-110 transition-transform`}>
                                    <Icon className={`w-4 h-4 ${c.text}`} />
                                </div>
                            )}
                        </div>
                        <div className="text-2xl font-semibold text-blue-50">{value}</div>
                    </div>
                    <div className="flex items-center gap-3 mt-2 min-h-[16px]">
                        <div className={`text-[11px] flex items-center font-medium ${subValue ? (subValue.startsWith('-') ? 'text-blue-400/60' : 'text-cyan-400') : ''}`}>
                            {subValue && (
                                <>
                                    {subValue !== "[% of PS]" && (subValue.startsWith('-') ? <RawArrowDownRightIcon className="w-3 h-3 mr-1" /> : <RawArrowUpRightIcon className="w-3 h-3 mr-1" />)}
                                    {subValue}
                                </>
                            )}
                        </div>
                        {badge}
                    </div>
                    {tooltip && (
                        <div className="absolute bottom-full left-0 mb-2 w-64 z-50 hidden group-hover:block">
                            <div className="bg-slate-900 border border-blue-700/40 text-blue-200/80 text-[11px] leading-relaxed p-3 rounded-xl shadow-2xl">
                                {tooltip.split('\n').map((line, i) => (
                                    <React.Fragment key={i}>
                                        {line}
                                        {i < tooltip.split('\n').length - 1 && <br />}
                                    </React.Fragment>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const PositionChart = ({ data, isPrivacyMode, chartSort, setChartSort }) => {
            if (!data || !data.positions || data.positions.length === 0) return null;

            const formatVal = (val) => val == null ? '--' : val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

            const getChartSortResult = (a, b) => {
                let valA, valB;
                if (chartSort.key === 'size') {
                    valA = Math.abs((a.pos || 0) * (a.price || 0));
                    valB = Math.abs((b.pos || 0) * (b.price || 0));
                } else if (chartSort.key === 'symbol') {
                    valA = a.symbol || '';
                    valB = b.symbol || '';
                } else if (chartSort.key === 'pnl') {
                    valA = a.pnl || 0;
                    valB = b.pnl || 0;
                } else if (chartSort.key === 'psRisk') {
                    valA = a.psRisk || 0;
                    valB = b.psRisk || 0;
                } else if (chartSort.key === 'risk') {
                    valA = a.risk || 0;
                    valB = b.risk || 0;
                } else if (chartSort.key === 'tGain') {
                    valA = a.tGain || 0;
                    valB = b.tGain || 0;
                } else if (chartSort.key === 'wadr') {
                    const posPctA = data.principalState > 0 ? (Math.abs(a.pos * a.avgCost) / data.principalState) : 0;
                    const posPctB = data.principalState > 0 ? (Math.abs(b.pos * b.avgCost) / data.principalState) : 0;
                    valA = posPctA * (a.adr || 0);
                    valB = posPctB * (b.adr || 0);
                }
                
                if (typeof valA === 'string' && typeof valB === 'string') {
                    return chartSort.direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return chartSort.direction === 'asc' ? valA - valB : valB - valA;
            };

            const sortedPositions = [...data.positions].sort(getChartSortResult);

            const maxVal = sortedPositions.reduce((max, p) => {
                const val = Math.abs((p.pos || 0) * (p.price || 0));
                return Math.max(max, val);
            }, 0);

            const handleToggleSort = (key) => {
                if (chartSort.key === key) {
                    setChartSort({ key, direction: chartSort.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setChartSort({ key, direction: key === 'size' ? 'desc' : 'asc' });
                }
            };

            return (
                <section className="mt-8 mb-12" id="position-chart-section">
                    <div className="bg-[#0f172a] border border-blue-900/20 rounded-2xl shadow-2xl p-6">
                        <div className="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 pb-4 border-b border-blue-900/10">
                            <div className="flex flex-col lg:flex-row lg:items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <RawActivityIcon className="w-5 h-5 text-blue-400" />
                                    <h2 className="text-lg font-semibold text-blue-50">Position Exposure & Risk Components</h2>
                                </div>
                                <div className="flex flex-wrap bg-blue-950/40 p-1 rounded-xl border border-blue-900/20 gap-1">
                                    <button 
                                        onClick={() => handleToggleSort('size')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'size' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        Size {chartSort.key === 'size' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('symbol')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'symbol' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        ABC {chartSort.key === 'symbol' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('pnl')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'pnl' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        PNL {chartSort.key === 'pnl' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('psRisk')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'psRisk' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        Open Risk {chartSort.key === 'psRisk' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('risk')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'risk' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        Market's Money {chartSort.key === 'risk' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('tGain')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'tGain' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        T-Gain {chartSort.key === 'tGain' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                    <button 
                                        onClick={() => handleToggleSort('wadr')}
                                        className={`px-3 py-1 rounded-lg text-[10px] font-bold uppercase transition-all ${chartSort.key === 'wadr' ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' : 'text-blue-400/40 hover:text-blue-300'}`}
                                    >
                                        WADR {chartSort.key === 'wadr' && (chartSort.direction === 'asc' ? '↑' : '↓')}
                                    </button>
                                </div>
                            </div>

                            
                            {/* Legend */}
                            <div className="flex items-center gap-6">
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 bg-emerald-400 rounded-sm shadow-[0_0_8px_rgba(52,211,153,0.3)]" />
                                    <span className="text-[10px] font-black text-emerald-400 uppercase tracking-[0.15em]">Open Profit</span>
                                </div>
                                <div className="flex items-center gap-2">
                                    <div className="w-3 h-3 bg-orange-400 rounded-sm shadow-[0_0_8px_rgba(251,146,60,0.3)]" />
                                    <span className="text-[10px] font-black text-orange-400 uppercase tracking-[0.15em]">Open Risk</span>
                                </div>
                            </div>
                        </div>


                        <div className="flex h-[420px] relative mb-6">
                            {/* Y-Axis Label */}
                            <div className="absolute -left-2 top-0 bottom-24 flex items-center justify-center">
                                <span className="text-[10px] font-black text-blue-400/80 uppercase tracking-[0.2em] -rotate-90 whitespace-nowrap">Exposure ($)</span>
                            </div>

                            <div className="flex-1 flex items-end gap-3 px-2 overflow-x-auto custom-scrollbar pb-24 ml-14">
                                {sortedPositions.map((pos) => {
                                    const totalValue = Math.abs((pos.pos || 0) * (pos.price || 0));
                                    const totalRisk = pos.risk || 0;
                                    const openRiskVal = pos.psRisk || 0;
                                    const profitRiskVal = Math.max(0, totalRisk - openRiskVal);
                                    
                                    const heightBase = maxVal > 0 ? (totalValue / maxVal) * 100 : 0;
                                    const openRiskPerc = totalValue > 0 ? (openRiskVal / totalValue) * 100 : 0;
                                    const profitRiskPerc = totalValue > 0 ? (profitRiskVal / totalValue) * 100 : 0;

                                    return (
                                        <div key={pos.symbol} className="flex-1 min-w-[60px] max-w-[120px] flex flex-col items-center group relative h-full justify-end">
                                            {/* Tooltip */}
                                            <div className="absolute bottom-full mb-3 hidden group-hover:block z-50">
                                                <div className="bg-slate-900 border border-blue-700/40 text-blue-200/80 text-[10px] p-2.5 rounded-xl shadow-2xl whitespace-nowrap">
                                                    <div className="font-bold text-blue-50 mb-1.5 border-b border-blue-900/20 pb-1">{pos.symbol}</div>
                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex justify-between gap-4"><span>Value:</span> <span className="text-blue-50 font-mono">{isPrivacyMode ? "***" : `$${formatVal(totalValue)}`}</span></div>
                                                        <div className="flex justify-between gap-4 text-emerald-400"><span>Profit at Risk:</span> <span className="font-mono">{isPrivacyMode ? "***" : `$${formatVal(profitRiskVal)}`}</span></div>
                                                        <div className="flex justify-between gap-4 text-orange-400"><span>Open Risk (Principal):</span> <span className="font-mono">{isPrivacyMode ? "***" : `$${formatVal(openRiskVal)}`}</span></div>
                                                        <div className="flex justify-between gap-4 pt-1 mt-1 border-t border-blue-900/30"><span>Total Risk:</span> <span className="text-blue-400 font-mono">{isPrivacyMode ? "***" : `$${formatVal(totalRisk)}`}</span></div>
                                                    </div>
                                                </div>
                                            </div>

                                            {/* % of PS Label */}
                                            {data.principalState > 0 && (
                                                <div className="mb-2 text-[12px] font-mono text-blue-400/50 whitespace-nowrap">
                                                    {isPrivacyMode ? "***" : `${((Math.abs(pos.pos * pos.avgCost) / data.principalState) * 100).toFixed(2)}% of PS`}
                                                </div>
                                            )}

                                            {/* Bar Container */}
                                            <div className="w-full relative flex flex-col justify-end overflow-hidden rounded-t-lg bg-blue-600/10 border border-blue-900/20 hover:border-blue-500/40 transition-all cursor-pointer group-hover:scale-[1.02]" style={{ height: `${Math.max(5, (heightBase * 0.85))}%` }}>
                                                {/* Profit Segment (Gains at risk) - TOP */}
                                                <div className="w-full bg-emerald-400/90" style={{ height: `${profitRiskPerc}%` }} />
                                                {/* Open Risk Segment (Principal at risk) - MIDDLE */}
                                                <div className="w-full bg-orange-500/90 shadow-[0_0_10px_rgba(249,115,22,0.2)]" style={{ height: `${openRiskPerc}%` }} />
                                                {/* Base / Safe Segment - BOTTOM */}
                                                <div className="w-full bg-blue-600/20 flex-1" />
                                            </div>

                                            {/* Labels (X-Axis Items) */}
                                            <div className="absolute -bottom-16 flex flex-col items-center">
                                                <span className="text-[10px] font-black text-blue-100/90 group-hover:text-blue-50 uppercase tracking-[0.1em] transition-colors">{pos.symbol}</span>
                                                <span className="text-[11px] text-purple-400/70 font-mono mt-0.5">{pos.adr ? `${formatVal(pos.adr)}%` : '--'}</span>
                                                {pos.adr && data.principalState > 0 && (
                                                    <span className="text-[11px] text-cyan-400/60 font-mono">
                                                        {((Math.abs(pos.pos * pos.avgCost) / data.principalState) * (pos.adr || 0)).toFixed(2)}%
                                                    </span>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>

                            {/* X-Axis Label */}
                            <div className="absolute bottom-1 left-0 right-0 flex justify-center h-4 z-0">
                                <span className="text-[10px] font-black text-blue-400/80 uppercase tracking-[0.2em]">
                                    Positions (Symbol / <span className="text-purple-400/80 font-bold">ADR%</span> / <span className="text-cyan-400/60 italic">WADR%</span>)
                                </span>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        const AlertTerminal = ({ alerts, onClear }) => {
            const list = alerts || [];
            
            // Group the alerts into priority buckets
            const critical = list.filter(a => a.type === 'CRITICAL');
            const market = list.filter(a => a.type === 'ALERT');
            const system = list.filter(a => a.type === 'INFO');

            const renderBucket = (bucket, title, accentColor) => {
                if (bucket.length === 0) return null;
                return (
                    <div className="mb-6 last:mb-0">
                        <div className="flex items-center gap-2 mb-2 px-3">
                            <div className={`w-1.5 h-1.5 rounded-sm ${accentColor} shadow-[0_0_8px_currentColor]`} />
                            <h3 className={`text-[12px] font-black uppercase tracking-[0.2em] ${accentColor}`}>{title} ({bucket.length})</h3>
                            <div className="flex-1 h-[1px] bg-blue-500/10 ml-2" />
                        </div>
                        <table className="w-full text-left border-collapse">
                            <tbody>
                                {bucket.map((alert, idx) => {
                                    let typeColor = "text-blue-400";
                                    let bgColor = "bg-blue-500/5";
                                    if (alert.type === 'ALERT') { typeColor = "text-amber-400"; bgColor = "bg-amber-500/5"; }
                                    if (alert.type === 'CRITICAL') { typeColor = "text-red-400"; bgColor = "bg-red-500/5"; }

                                    return (
                                        <tr key={idx} className={`border-b border-blue-500/5 group hover:bg-white/5 transition-colors`}>
                                            <td className="py-1 px-3 w-[100px] text-[12px] text-blue-500/40 font-mono whitespace-nowrap">
                                                [{alert.time}]
                                            </td>
                                            <td className={`py-1 px-3 text-[14px] ${alert.type === 'CRITICAL' ? 'text-red-300' : (alert.type === 'ALERT' ? 'text-amber-100/90' : 'text-blue-100/70')} group-hover:text-blue-50 transition-colors`}>
                                                {alert.message.includes('RESOLVED') ? (
                                                    <span className="flex items-center gap-2">
                                                        <span className="px-1.5 py-0.5 bg-emerald-500/20 text-emerald-400 text-[9px] font-black rounded uppercase tracking-widest border border-emerald-500/30">Resolved</span>
                                                        {alert.message.replace('RESOLVED: ', '')}
                                                    </span>
                                                ) : alert.message}
                                            </td>
                                            <td className="py-1 px-3 text-right hidden sm:table-cell">
                                                <div className="flex justify-end gap-1 opacity-10 group-hover:opacity-100 transition-opacity">
                                                    <div className="w-1 h-2 bg-blue-500/20" />
                                                </div>
                                            </td>
                                        </tr>
                                    );
                                })}
                            </tbody>
                        </table>
                    </div>
                );
            };

            return (
                <section className="mt-8 mb-12">
                    <div className="terminal-container border border-blue-500/20 rounded-2xl shadow-[0_0_30px_rgba(30,58,138,0.2)] overflow-hidden">
                        <div className="terminal-scanline absolute inset-0 opacity-20 z-10 pointer-events-none" />
                        
                        <div className="p-4 border-b border-blue-500/10 flex items-center justify-between bg-black/40 relative z-20">
                            <div className="flex items-center gap-3">
                                <div className="flex gap-1.5">
                                    <div className="w-2 h-2 rounded-full bg-red-500/40" />
                                    <div className="w-2 h-2 rounded-full bg-amber-500/40" />
                                    <div className="w-2 h-2 rounded-full bg-emerald-500/40" />
                                </div>
                                <div className="h-4 w-[1px] bg-blue-500/20 mx-1" />
                                <div className="flex items-center gap-2">
                                    <RawDatabaseIcon className="w-3.5 h-3.5 text-cyan-400 terminal-glow" />
                                    <h2 className="text-[13px] font-bold text-blue-100 uppercase tracking-[0.2em] terminal-glow">Integrated Log System v2.1</h2>
                                </div>
                            </div>
                            <div className="flex items-center gap-4 text-[11px] font-mono text-blue-500/40 uppercase tracking-widest">
                                <button 
                                    onClick={() => {
                                        if (confirm("Clear system log history? Active critical alerts will remain tracked.")) {
                                            onClear();
                                        }
                                    }}
                                    className="px-2 py-1 bg-blue-500/5 hover:bg-red-500/10 text-blue-300/40 hover:text-red-400 border border-blue-500/10 hover:border-red-500/30 rounded transition-all active:scale-95 flex items-center gap-1.5 group/btn"
                                >
                                    <RawXIcon className="w-3 h-3 group-hover/btn:rotate-90 transition-transform" />
                                    Clear history
                                </button>
                                <span className="hidden sm:inline">Buffer: <span className="text-emerald-400">{list.length} MSG</span></span>
                                <span className="hidden md:inline">Node: BR_SAOSP_X1</span>
                            </div>
                        </div>

                        <div className="p-4 bg-black/70 relative z-20 max-h-[500px] overflow-y-auto custom-scrollbar">
                            {renderBucket(critical, "CRITICAL ALERTS", "text-red-400")}
                            {renderBucket(market, "MARKET ALERTS", "text-amber-400")}
                            {renderBucket(system, "SYSTEM FEED", "text-blue-400")}
                            
                            {list.length === 0 && (
                                <div className="py-12 text-center text-blue-900/30 text-[12px] uppercase tracking-widest font-bold">
                                    No system messages in buffer...
                                </div>
                            )}
                        </div>
                        
                        <div className="p-2.5 bg-black/80 border-t border-blue-500/10 flex items-center justify-between relative z-20">
                            <div className="flex gap-4">
                                <div className="flex items-center gap-1.5">
                                    <div className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse" />
                                    <span className="text-[11px] font-bold text-emerald-400/60 uppercase tracking-tighter cursor-default">Real-time Stream Connected</span>
                                </div>
                            </div>
                            <div className="flex items-center gap-2">
                                <div className="w-[100px] h-1 bg-blue-500/10 rounded-full overflow-hidden">
                                    <div className="w-1/3 h-full bg-blue-500/30 animate-[loading_2s_infinite]" />
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        function App() {
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [autoRefresh, setAutoRefresh] = useState(() => { const v = localStorage.getItem('autoRefresh'); return v !== null ? JSON.parse(v) : true; });
            const [refreshInterval, setRefreshInterval] = useState(() => { const v = localStorage.getItem('refreshInterval'); return v ? parseInt(v) : 30; });
            const [baseline, setBaseline] = useState(() => { const v = localStorage.getItem('baseline'); return v ? parseInt(v) : 100000; });
            const [port, setPort] = useState(() => { const v = localStorage.getItem('port'); return v ? parseInt(v) : 7496; });
            const [clientId, setClientId] = useState(() => { const v = localStorage.getItem('clientId'); return v ? parseInt(v) : 10; });
            const [isPrivacyMode, setIsPrivacyMode] = useState(() => { const v = localStorage.getItem('isPrivacyMode'); return v !== null ? JSON.parse(v) : false; });
            const [connectionStatus, setConnectionStatus] = useState(false);
            const [connectedClientId, setConnectedClientId] = useState(null);
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [refreshing, setRefreshing] = useState(false);
            const [maPeriod, setMaPeriod] = useState(20);
            const [accountId, setAccountId] = useState(() => { return localStorage.getItem('accountId') || ""; });
            const [error, setError] = useState(null);
            const [tradeDayView, setTradeDayView] = useState('today');

            const [systemAlerts, setSystemAlerts] = useState([]);
            const [availableAccounts, setAvailableAccounts] = useState([]);

            // Sorting logic
            const [posSort, setPosSort] = useState({ key: 'size', direction: 'desc' });
            const [activeSort, setActiveSort] = useState({ key: 'time', direction: 'desc' });
            const [closedSort, setClosedSort] = useState({ key: 'date', direction: 'desc' });
            const [chartSort, setChartSort] = useState({ key: 'size', direction: 'desc' });

            const handleSort = (table, key) => {
                const configurations = {
                    positions: [posSort, setPosSort],
                    active: [activeSort, setActiveSort],
                    closed: [closedSort, setClosedSort]
                };
                const [config, setConfig] = configurations[table];
                if (config.key === key) {
                    setConfig({ key, direction: config.direction === 'asc' ? 'desc' : 'asc' });
                } else {
                    setConfig({ key, direction: 'desc' });
                }
            };

            const getSortResult = (a, b, key, direction) => {
                let valA, valB;

                // Handle special calculated keys
                if (key === 'size') {
                    valA = Math.abs((a.pos || 0) * (a.avgCost || 0));
                    valB = Math.abs((b.pos || 0) * (b.avgCost || 0));
                } else if (key === 'marketValue') {
                    valA = Math.abs((a.pos || 0) * (a.price || 0));
                    valB = Math.abs((b.pos || 0) * (b.price || 0));
                } else if (key === 'pctOfPs') {
                    if (a.pos !== undefined) { // Position
                        valA = data && data.principalState ? Math.abs(a.pos * a.avgCost) / data.principalState : 0;
                        valB = data && data.principalState ? Math.abs(b.pos * b.avgCost) / data.principalState : 0;
                    } else if (a.pnl !== undefined) { // Closed Trade
                        valA = data && data.principalState ? (a.pnl / data.principalState) : 0;
                        valB = data && data.principalState ? (b.pnl / data.principalState) : 0;
                    } else {
                        valA = 0; valB = 0;
                    }
                } else {
                    valA = a[key];
                    valB = b[key];
                }

                if (valA === undefined || valA === null) valA = 0;
                if (valB === undefined || valB === null) valB = 0;

                if (typeof valA === 'string' && typeof valB === 'string') {
                    return direction === 'asc' ? valA.localeCompare(valB) : valB.localeCompare(valA);
                }
                return direction === 'asc' ? valA - valB : valB - valA;
            };

            const SortIcon = ({ tableConfig, columnKey }) => {
                if (tableConfig.key !== columnKey) return null;
                return tableConfig.direction === 'asc' ? <ChevronUp className="w-3 h-3 inline ml-1" /> : <ChevronDown className="w-3 h-3 inline ml-1" />;
            };

            const maPeriodRef = useRef(20);
            const accountIdRef = useRef(localStorage.getItem('accountId') || "");
            const refreshingRef = useRef(false);
            const refreshTimeoutRef = useRef(null);



            // Save variables to localStorage whenever they change
            useEffect(() => { localStorage.setItem('autoRefresh', JSON.stringify(autoRefresh)); }, [autoRefresh]);
            useEffect(() => { localStorage.setItem('refreshInterval', refreshInterval); }, [refreshInterval]);
            useEffect(() => { localStorage.setItem('baseline', baseline); }, [baseline]);
            useEffect(() => { localStorage.setItem('port', port); }, [port]);
            useEffect(() => { localStorage.setItem('clientId', clientId); }, [clientId]);
            useEffect(() => {
                localStorage.setItem('accountId', accountId);
                accountIdRef.current = accountId; // Sync ref
            }, [accountId]);
            useEffect(() => { localStorage.setItem('isPrivacyMode', JSON.stringify(isPrivacyMode)); }, [isPrivacyMode]);
            const [isSizerOpen, setIsSizerOpen] = useState(false);

            // Standalone Mode Detection for Detached Window
            const queryParams = new URLSearchParams(window.location.search);
            const isStandaloneSizer = queryParams.get('mode') === 'standalone';
            const standalonePrincipalState = parseFloat(queryParams.get('principalState')) || 0;

            if (isStandaloneSizer) {
                return (
                    <div className="min-h-screen bg-[#020617] flex items-center justify-center p-0 overflow-hidden">
                        <PositionSizerContent 
                            principalState={standalonePrincipalState} 
                            onClose={() => window.close()} 
                            isStandalone={true} 
                        />
                    </div>
                );
            }

            // Check connection on load
            useEffect(() => {
                checkStatus();
                const interval = setInterval(checkStatus, 5000);
                return () => clearInterval(interval);
            }, []);

            // Initial fetch when connection becomes active
            useEffect(() => {
                if (connectionStatus && !data) {
                    fetchData();
                }
            }, [connectionStatus]);

            // Auto-refresh: restarts whenever any config changes
            useEffect(() => {
                if (autoRefresh && connectionStatus) {
                    const interval = setInterval(() => fetchData(), refreshInterval * 1000);
                    return () => clearInterval(interval);
                }
            }, [autoRefresh, refreshInterval, connectionStatus]);

            const checkStatus = async () => {
                try {
                    const res = await fetch(`${API_BASE}/status`);
                    const info = await res.json();
                    if (info.alerts) setSystemAlerts(info.alerts);
                    setConnectionStatus(info.connected);
                    setConnectedClientId(info.client_id);

                    if (info.connected && info.accounts && info.accounts.length > 0) {
                        setAvailableAccounts(info.accounts);
                        // Auto select first account if current is empty or not in the list
                        if (!accountIdRef.current || !info.accounts.includes(accountIdRef.current)) {
                            setAccountId(info.accounts[0]);
                            accountIdRef.current = info.accounts[0];
                        }
                    }
                } catch (e) {
                    setConnectionStatus(false);
                }
            };

            const connectIB = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_BASE}/connect`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ host: "127.0.0.1", port: parseInt(port), clientId: parseInt(clientId) })
                    });
                    if (res.ok) {
                        const jsonRes = await res.json();
                        setConnectionStatus(true);

                        // Handle auto-account detection
                        if (jsonRes.accounts && jsonRes.accounts.length > 0) {
                            setAvailableAccounts(jsonRes.accounts);
                            // Auto select first account if current is not in the list
                            if (!jsonRes.accounts.includes(accountIdRef.current)) {
                                setAccountId(jsonRes.accounts[0]);
                                accountIdRef.current = jsonRes.accounts[0];
                            }
                        }

                        // Await the initial fetch
                        const fetchSuccess = await fetchData(true);
                        if (!fetchSuccess) {
                            // If the initial fetch fails (e.g. invalid account), auto-disconnect
                            await disconnectIB();
                        }
                    } else {
                        const err = await res.json();
                        alert(err.detail);
                    }
                } catch (e) {
                    alert("Failed to connect to backend");
                }
                setLoading(false);
            };

            const disconnectIB = async () => {
                await fetch(`${API_BASE}/disconnect`, { method: 'POST' });
                setConnectionStatus(false);
                setData(null);
            };

            const clearAlerts = async () => {
                try {
                    const res = await fetch(`${API_BASE}/clear-alerts`, { method: 'POST' });
                    if (res.ok) {
                        setSystemAlerts([]);
                        // Immediately fetch fresh data to sync the 1-line "cleared" log from backend
                        fetchData(true);
                    } else {
                        const err = await res.json();
                        alert("Failed to clear log: " + (err.detail || "Server error"));
                    }
                } catch (e) {
                    console.error("Failed to clear alerts:", e);
                }
            };

            // Regular fetch — skips if one is already in progress (used by interval)
            const fetchData = async (force = false) => {
                if (refreshingRef.current && !force) return false;
                refreshingRef.current = true;
                setRefreshing(true);
                let success = false;
                try {
                    const res = await fetch(`${API_BASE}/data`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        // Always uses the REF so interval closures never capture stale value
                        body: JSON.stringify({ accountId: accountIdRef.current, maPeriod: maPeriodRef.current })
                    });
                    if (res.ok) {
                        const json = await res.json();

                        if (json.alerts) setSystemAlerts(json.alerts);
                        setData(json);
                        setError(null);
                        success = true;
                    }
                    else {
                        const err = await res.json();
                        setError(err.detail);
                    }
                } catch (e) { setError("Lost connection to backend"); }
                finally {
                    if (refreshTimeoutRef.current) clearTimeout(refreshTimeoutRef.current);
                    refreshTimeoutRef.current = setTimeout(() => {
                        refreshingRef.current = false;
                        setRefreshing(false);
                    }, 400);
                }
                return success;
            };

            // Force fetch with a specific period — safely resets the lock
            const forceFetch = async (period) => {
                maPeriodRef.current = period;  // update ref immediately, before fetch
                setMaPeriod(period);           // update state for display
                refreshingRef.current = true;
                setRefreshing(true);
                try {
                    const res = await fetch(`${API_BASE}/data`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ accountId: accountIdRef.current, maPeriod: period })
                    });
                    if (res.ok) {
                        const json = await res.json();

                        if (json.alerts) setSystemAlerts(json.alerts);
                        setData(json);
                        setError(null);
                    }
                    else { const err = await res.json(); setError(err.detail); }
                } catch (e) { setError("Lost connection to backend"); }
                finally {
                    if (refreshTimeoutRef.current) clearTimeout(refreshTimeoutRef.current);
                    refreshTimeoutRef.current = setTimeout(() => {
                        refreshingRef.current = false;
                        setRefreshing(false);
                    }, 400);
                }
            };

            let coverage = 0;
            if (data) {

                    coverage = data.totalPsRisk > 0 ? Infinity : 0;
                } else {
                    coverage = (data.totalPsRisk / data.thresholdGains) * 100;

            }
            const buffer = data ? (data.thresholdGains - data.totalPsRisk) : 0;

            // Helper to strictly format ALL numbers to exactly 2 decimal places
            const formatVal = (val) => val == null ? '--' : val.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            const pctOfNl = (val) => data && data.principalState ? `${(val / data.principalState * 100).toFixed(2)}% [% of PS]` : null;

            const getCardValue = (val) => {
                if (val == null) return "$--";
                if (isPrivacyMode) {
                    if (data && data.principalState) return `${(val / data.principalState * 100).toFixed(2)}%`;
                    return "***";
                }
                return `$${formatVal(val)}`;
            };

            const getCardSubValue = (val) => {
                if (val == null) return null;
                if (isPrivacyMode) return "[% of PS]";
                return pctOfNl(val);
            };

            return (
                <div className="min-h-screen bg-[#020617] text-slate-300 font-sans selection:bg-blue-500/30">
                    {/* Sidebar */}
                    <aside className={`fixed left-0 top-0 h-full bg-[#070a13] border-r border-blue-900/20 transition-all duration-300 z-50 flex flex-col overflow-hidden ${sidebarOpen ? 'w-72' : 'w-16'}`}>

                                <RawShieldIcon className="w-6 h-6 text-blue-400" />
                            </div>
                            <span className={`font-bold text-lg tracking-tight text-blue-50 uppercase italic whitespace-nowrap transition-all duration-200 ${sidebarOpen ? 'opacity-100 w-auto' : 'opacity-0 w-0'}`}>Navigator</span>
                        </div>

                        {/* Content — full when open */}

                                    <input type="number" value={baseline} onChange={(e) => setBaseline(e.target.value)} className="w-full bg-blue-950/20 rounded-xl p-3 border border-blue-900/20 text-blue-50 font-bold focus:ring-1 focus:ring-blue-500/40 outline-none text-md transition-all duration-300" />
                                </div>

                                    <div className="relative group inline-flex items-center gap-1.5 cursor-help">
                                        <span className="text-[11px] text-blue-300/60 uppercase font-black tracking-[0.15em]">Threshold Gains MA</span>
                                        <RawInfoIcon className="w-3 h-3 text-blue-900 group-hover:text-blue-500 transition-colors" />
                                        <div className="absolute left-full top-1/2 -translate-y-1/2 ml-2 w-64 z-50 hidden group-hover:block">
                                            <div className="bg-slate-900 border border-blue-700/40 text-blue-200/80 text-[11px] leading-relaxed p-3 rounded-xl shadow-2xl">
                                                The backend logic is configured to choose the tighter of your Stop Price and your Moving Average (MA) as the effective exit point for calculating metrics.
                                            </div>

                                    <div className="flex gap-2">
                                        {[10, 20].map(p => (

                                        <RawZapIcon className="w-3 h-3" /> {loading ? "Connecting..." : (connectionStatus ? "Connected" : "Connect")}
                                    </button>

                                        <button onClick={disconnectIB} className="col-span-1 flex items-center justify-center gap-2 bg-red-950/10 border border-red-900/20 py-2 rounded-lg text-[10px] font-bold text-red-500/60 hover:bg-red-900/20 transition-all duration-300 uppercase active:scale-95">
                                            <RawPowerIcon className="w-3 h-3" /> Off

                                </div>
