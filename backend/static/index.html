                                                    <td className="px-3 py-4 text-center font-mono text-purple-400/80">{pos.adr ? `${formatVal(pos.adr)}%` : '--'}</td>

                                                    <td className={`px-3 py-4 text-center font-mono ${maPeriod === 10 ? 'text-cyan-400 font-semibold' : 'text-blue-400/40'}`}>{pos.ma10 ? `$${formatVal(pos.ma10)}` : '--'}</td>
                                                    <td className={`px-3 py-4 text-center font-mono ${maPeriod === 20 ? 'text-cyan-400 font-semibold' : 'text-blue-400/40'}`}>{pos.ma20 ? `$${formatVal(pos.ma20)}` : '--'}</td>
                                                    <td className={`px-3 py-4 text-center font-semibold font-mono ${pos.pnl > 0 ? 'text-cyan-400' : 'text-blue-400/60'}`}>
                                                        {isPrivacyMode ? "***" : `$${formatVal(pos.pnl)}`}
                                                    </td>
                                                    <td className="px-3 py-4 text-center font-bold font-mono text-orange-400/80">{isPrivacyMode ? "***" : `$${formatVal(pos.psRisk)}`}</td>
                                                    <td className="px-3 py-4 text-center font-bold font-mono text-blue-400/80">{isPrivacyMode ? "***" : `$${formatVal(pos.risk)}`}</td>
                                                    <td className="px-3 py-4 text-center text-slate-500 font-mono">{isPrivacyMode ? "***" : `$${formatVal(pos.tGain)}`}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                    {!data && <div className="p-12 text-center text-blue-900 font-bold uppercase tracking-widest">No Active Connection</div>}
                                </div>
                            </div>
                        </section>

                        {/* Position Chart */}
                        <PositionChart 
                            data={data} 
                            isPrivacyMode={isPrivacyMode} 
                            chartSort={chartSort}
                            setChartSort={setChartSort}
                        />

                        {/* Today's & Yesterday's Trades Activity */}
                        <section className="mt-8">
                            <div className="bg-[#0f172a] border border-blue-900/20 rounded-2xl shadow-2xl overflow-hidden">
                                <div className="p-6 border-b border-blue-900/10 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 bg-blue-950/20">
                                    <div className="flex items-center gap-2">
                                        <RawActivityIcon className="w-5 h-5 text-cyan-400" />
                                        <h2 className="text-lg font-semibold text-blue-50">
                                            {tradeDayView === 'today' ? "Today's Trades" : (tradeDayView === 'yesterday' ? "Yesterday's Trades" : "Last 7 Days Trades")}
                                        </h2>
                                    </div>
                                    <div className="flex items-center gap-3 w-full sm:w-auto overflow-hidden">
                                        <div className="flex bg-[#020617] p-1 rounded-xl border border-blue-900/20 w-full sm:w-auto flex-wrap sm:flex-nowrap justify-center">
                                            <button 
                                                onClick={() => setTradeDayView('today')}
                                                className={`flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all duration-300 active:scale-95 whitespace-nowrap ${
                                                    tradeDayView === 'today' 
                                                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' 
                                                        : 'text-blue-400/40 hover:text-blue-300'
                                                }`}
                                            >
                                                Today
                                            </button>
                                            <button 
                                                onClick={() => setTradeDayView('yesterday')}
                                                className={`flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all duration-300 active:scale-95 whitespace-nowrap ${
                                                    tradeDayView === 'yesterday' 
                                                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' 
                                                        : 'text-blue-400/40 hover:text-blue-300'
                                                }`}
                                            >
                                                Yesterday
                                            </button>
                                            <button 
                                                onClick={() => setTradeDayView('last7')}
                                                className={`flex-1 sm:flex-none px-4 py-1.5 rounded-lg text-[10px] font-bold uppercase transition-all duration-300 active:scale-95 whitespace-nowrap ${
                                                    tradeDayView === 'last7' 
                                                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-500/20' 
                                                        : 'text-blue-400/40 hover:text-blue-300'
                                                }`}
                                            >
                                                Last 7 Days
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Active Activity Section */}
                                <div className="p-4 bg-blue-900/5 border-b border-blue-900/10">
                                    <span className="text-[10px] font-bold text-blue-400 uppercase tracking-[0.2em] ml-2">Recent Activity</span>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[600px]">
                                        <thead>
                                            <tr className="bg-blue-950/10 border-b border-blue-900/10">
                                                <th onClick={() => handleSort('active', 'symbol')} className="w-[12%] px-6 py-4 text-[11px] font-black text-blue-100/80 uppercase tracking-[0.15em] border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Ticker<SortIcon tableConfig={activeSort} columnKey="symbol" /></th>
                                                <th onClick={() => handleSort('active', 'side')} className="w-[10%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Side<SortIcon tableConfig={activeSort} columnKey="side" /></th>
                                                <th onClick={() => handleSort('active', 'shares')} className="w-[12%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Quantity<SortIcon tableConfig={activeSort} columnKey="shares" /></th>
                                                <th onClick={() => handleSort('active', 'date')} className="w-[15%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Date<SortIcon tableConfig={activeSort} columnKey="date" /></th>
                                                <th onClick={() => handleSort('active', 'avgPrice')} className="w-[18%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Avg Price<SortIcon tableConfig={activeSort} columnKey="avgPrice" /></th>
                                                <th onClick={() => handleSort('active', 'fees')} className="w-[17%] px-6 py-4 text-[11px] font-black text-amber-500/80 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Taxas<SortIcon tableConfig={activeSort} columnKey="fees" /></th>
                                                <th onClick={() => handleSort('active', 'time')} className="w-[16%] px-6 py-4 text-[11px] font-black text-slate-500 uppercase tracking-[0.15em] text-right border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Last Fill<SortIcon tableConfig={activeSort} columnKey="time" /></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-blue-900/5 text-sm">
                                            {data?.trades?.[tradeDayView]?.active && data.trades[tradeDayView].active.length > 0 ? (
                                                [...data.trades[tradeDayView].active].sort((a,b) => getSortResult(a,b, activeSort.key, activeSort.direction)).map((trade, idx) => (
                                                    <tr key={`active-${trade.symbol}-${idx}`} className="hover:bg-blue-900/10 transition-colors group">
                                                        <td className="px-6 py-4 font-bold text-blue-50">{trade.symbol}</td>
                                                        <td className="px-6 py-4 text-center">
                                                            <span className={`px-2 py-1 rounded-md text-[10px] font-bold uppercase ${
                                                                trade.side === 'BOT' 
                                                                    ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' 
                                                                    : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                                            }`}>
                                                                {trade.side === 'BOT' ? 'Long' : 'Short'}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-blue-200/70">
                                                            {isPrivacyMode ? "***" : trade.shares.toLocaleString()}
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-blue-200/70">
                                                            {trade.date}
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-blue-200/70">
                                                            ${formatVal(trade.avgPrice)}
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-amber-400/60">
                                                            {isPrivacyMode ? "***" : `$${formatVal(trade.fees)}`}
                                                        </td>
                                                        <td className="px-6 py-4 text-right font-mono text-blue-400/50">
                                                            {trade.time}
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="6" className="px-6 py-8 text-center text-blue-900/30 font-bold uppercase tracking-[0.2em] text-xs">
                                                        No active trades recorded
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Closed Trades Section */}
                                <div className="p-4 bg-emerald-900/5 border-t border-b border-blue-900/10 mt-4">
                                    <span className="text-[10px] font-bold text-emerald-400 uppercase tracking-[0.2em] ml-2">Closed Trades (Realized)</span>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse min-w-[600px]">
                                        <thead>
                                            <tr className="bg-blue-950/10 border-b border-blue-900/10">
                                                <th onClick={() => handleSort('closed', 'symbol')} className="w-[12%] px-6 py-4 text-[11px] font-black text-blue-100/80 uppercase tracking-[0.15em] border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Ticker<SortIcon tableConfig={closedSort} columnKey="symbol" /></th>
                                                <th onClick={() => handleSort('closed', 'side')} className="w-[10%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Side<SortIcon tableConfig={closedSort} columnKey="side" /></th>
                                                <th onClick={() => handleSort('closed', 'shares')} className="w-[12%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Quantity<SortIcon tableConfig={closedSort} columnKey="shares" /></th>
                                                <th onClick={() => handleSort('closed', 'date')} className="w-[15%] px-6 py-4 text-[11px] font-black text-slate-400 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Date<SortIcon tableConfig={closedSort} columnKey="date" /></th>
                                                <th onClick={() => handleSort('closed', 'pnl')} className="w-[18%] px-6 py-4 text-[11px] font-black text-emerald-400/80 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">PNL<SortIcon tableConfig={closedSort} columnKey="pnl" /></th>
                                                <th onClick={() => handleSort('closed', 'fees')} className="w-[17%] px-6 py-4 text-[11px] font-black text-amber-500/80 uppercase tracking-[0.15em] text-center border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">Taxas<SortIcon tableConfig={closedSort} columnKey="fees" /></th>
                                                <th onClick={() => handleSort('closed', 'pctOfPs')} className="w-[16%] px-6 py-4 text-[11px] font-black text-slate-500 uppercase tracking-[0.15em] text-right border-b border-blue-900/30 cursor-pointer hover:bg-blue-900/40 transition-colors">% of PS<SortIcon tableConfig={closedSort} columnKey="pctOfPs" /></th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-blue-900/5 text-sm">
                                            {data?.trades?.[tradeDayView]?.closed && data.trades[tradeDayView].closed.length > 0 ? (
                                                [...data.trades[tradeDayView].closed].sort((a,b) => getSortResult(a,b, closedSort.key, closedSort.direction)).map((trade, idx) => (
                                                    <tr key={`closed-${trade.symbol}-${idx}`} className="hover:bg-blue-900/10 transition-colors group">
                                                        <td className="px-6 py-4 font-bold text-blue-50">{trade.symbol}</td>
                                                        <td className="px-6 py-4 text-center">
                                                            <span className={`px-2 py-1 rounded-md text-[10px] font-bold uppercase ${
                                                                trade.side === 'Long' 
                                                                    ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20' 
                                                                    : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                                            }`}>
                                                                {trade.side}
                                                            </span>
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-blue-200/70">
                                                            {isPrivacyMode ? "***" : trade.shares.toLocaleString()}
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-blue-200/70">
                                                            {trade.date}
                                                        </td>
                                                        <td className={`px-6 py-4 text-center font-bold font-mono ${trade.pnl >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                                            {isPrivacyMode ? "***" : `$${formatVal(trade.pnl)}`}
                                                        </td>
                                                        <td className="px-6 py-4 text-center font-mono text-amber-400/60">
                                                            {isPrivacyMode ? "***" : `$${formatVal(trade.fees)}`}
                                                        </td>
                                                        <td className="px-6 py-4 text-right font-mono text-blue-400/50">
                                                            {data.principalState ? `${(trade.pnl / data.principalState * 100).toFixed(2)}%` : '--'}
                                                        </td>
                                                    </tr>
                                                ))
                                            ) : (
                                                <tr>
                                                    <td colSpan="6" className="px-6 py-8 text-center text-blue-900/30 font-bold uppercase tracking-[0.2em] text-xs">
                                                        No closed trades recorded
                                                    </td>
                                                </tr>
                                            )}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </section>

                        {/* System Alerts & News Terminal */}
                        <AlertTerminal alerts={systemAlerts} onClear={clearAlerts} />

                        {/* FAQ Section */}
                        <section className="mt-8">
                            <div className="bg-[#0f172a] border border-blue-900/20 rounded-2xl overflow-hidden shadow-2xl p-6">
                                <div className="flex items-center gap-2 mb-4">
                                    <RawInfoIcon className="w-5 h-5 text-blue-400" />
                                    <h2 className="text-lg font-semibold text-blue-50">FAQ</h2>
                                </div>
                                <div className="space-y-4">
                                    <div className="bg-blue-950/20 border border-blue-900/20 p-5 rounded-xl">
                                        <h3 className="font-semibold text-blue-100 mb-2">What Total Market's Money Actually Is?</h3>
                                        <p className="text-sm text-slate-400 mb-3">
                                            If every single one of your active positions immediately dropped and triggered your stop price (or fell to your Moving Average fallback), your total account balance would drop by the exact amount shown in the Total Market's Money box.
                                        </p>
                                        <p className="text-sm text-slate-400 mb-3">
                                            Your Total Market's Money is a combination of two things:
                                        </p>
                                        <ul className="text-sm text-slate-400 space-y-2 list-decimal pl-5 marker:text-blue-500/50">
                                            <li>
                                                <strong className="text-blue-300 font-medium">Sinking Principal (The Bad Risk, or Open Risk):</strong> If you enter a trade and it immediately goes against you, the difference between your Current Price and the Stop Loss represents original capital (your own money) that you are risking.
                                            </li>
                                            <li>
                                                <strong className="text-blue-300 font-medium">Dynamic Gains (The Fluid Profit Risk):</strong> If you are in a winning trade but you haven't moved your stop up to protect that profit yet, the difference between the Current Price and the Stop Loss represents "The Market's Money" that you are currently floating. You haven't locked it in, so it's technically at risk of being given back.
                                            </li>
                                        </ul>
                                        <p className="text-sm text-slate-400 mt-3 italic">
                                            Total Market's Money combines these two numbers across your entire portfolio. It is the absolute maximum amount of money—whether it's your principal or unprotected profits—that the market can physically take back from you right now, assuming no drastic price gaps past your stops.
                                        </p>
                                    </div>
                                    <div className="bg-blue-950/20 border border-blue-900/20 p-5 rounded-xl">
                                        <h3 className="font-semibold text-blue-100 mb-2">What is the purpose of the Risk Coverage Ratio?</h3>
                                        <p className="text-sm text-slate-400 mb-3">
                                            The Risk Coverage Ratio tells you what percentage of your secured profits you are currently risking in the market. It shows the relationship between your true Open Risk (Principal State Risk) and your Threshold Gains.
                                        </p>
                                        <ul className="text-sm text-slate-400 space-y-2 list-disc pl-5 marker:text-blue-500/50">
                                            <li>
                                                <strong className="text-blue-300 font-medium">If the ratio is low (e.g., &lt; 50% "Safe/Caution"):</strong> You are risking a fraction of your protected profits. Even if all your current risks were realized (hit your stops), you would still be left with a net positive gain from your protected positions.
                                            </li>
                                            <li>
                                                <strong className="text-blue-300 font-medium">If the ratio is 100% ("Defense"):</strong> You are risking exactly as much as you have secured. Your "Safety Buffer" is $0.
                                            </li>
                                            <li>
                                                <strong className="text-blue-300 font-medium">If the ratio is &gt; 100%:</strong> You are risking more than your current protected profits. This means if all your stops were hit, your recent protected gains wouldn't be enough to cover the losses, and it would eat into your principal.
                                            </li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>
                    <PositionSizerFAB onClick={() => setIsSizerOpen(true)} />
                    <PositionSizerModal 
                        isOpen={isSizerOpen} 
                        onClose={() => setIsSizerOpen(false)} 
                        principalState={data?.principalState || 0}
                    />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
